<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Падел-клубы на карте</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  #header {
    padding: 12px 16px; background: #fc3f1d; color: white;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  #header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  #searchBox {
    flex: 1; min-width: 200px; padding: 8px 12px;
    border: none; border-radius: 4px; font-size: 14px; outline: none;
  }
  #searchBtn {
    padding: 8px 20px; border: none; border-radius: 4px;
    background: #fff; color: #fc3f1d; font-weight: 600;
    cursor: pointer; font-size: 14px;
  }
  #searchBtn:hover { background: #ffeae5; }
  #mapWrap { flex: 1; position: relative; }
  #mapFrame {
    position: absolute; inset: 0;
    width: 100%; height: 100%; border: 0;
  }
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <h1>🎾 Падел-клубы</h1>
    <input id="searchBox" type="text" placeholder="Например: падел клуб Москва" value="падел клуб Москва">
    <button id="searchBtn" onclick="doSearch()">Найти</button>
  </div>
  <div id="mapWrap">
    <iframe id="mapFrame"
            src="https://yandex.ru/map-widget/v1/?text=падел%20клуб%20Москва&amp;ll=37.617%2C55.755&amp;z=11"
            allowfullscreen
            loading="lazy">
    </iframe>
  </div>
</div>

<script>
function doSearch() {
  const q = (document.getElementById('searchBox').value || '').trim();
  if (!q) return;
  const url = 'https://yandex.ru/map-widget/v1/?text=' + encodeURIComponent(q) + '&ll=37.617%2C55.755&z=11';
  document.getElementById('mapFrame').src = url;
}

document.getElementById('searchBox').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});
</script>

</body>
</html>
