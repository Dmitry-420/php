<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHP — Уроки</title>
<!-- Критический CSS — сразу, в HTML -->
<style>
  * { box-sizing: border-box; }

:root {
  --sidebar-width: 280px;
  --bg: #0f172a;
  --bg-card: #1e293b;
  --border: #334155;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --accent: #38bdf8;
  --accent-yellow: #fbbf24;
  --accent-green: #86efac;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  display: flex;
  min-height: 100vh;
}

/* ==== Боковая панель ==== */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: var(--sidebar-width);
  height: 100vh;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 50;
  transition: transform 0.25s ease;
  overflow-y: auto;
}

.sidebar-header {
  padding: 24px 24px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.logo {
  display: block;
  font-size: 24px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: 1px;
}

.logo-sub {
  display: block;
  font-size: 13px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-top: 2px;
}

.nav {
  padding: 12px 12px 24px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-item {
  display: block;
  width: 100%;
  padding: 12px 16px;
  color: var(--text-dim);
  background: none;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  font-family: inherit;
  transition: background 0.15s, color 0.15s;
}

.nav-item:hover {
  background: rgba(56, 189, 248, 0.08);
  color: var(--text);
}

.nav-item.active {
  background: rgba(56, 189, 248, 0.15);
  color: var(--accent);
  font-weight: 600;
}

/* ==== Контент ==== */
.content {
  margin-left: var(--sidebar-width);
  flex: 1;
  padding: 40px 40px 80px;
  min-width: 0;
  transition: margin-left 0.25s ease;
}

.container { max-width: 1100px; margin: 0 auto; }

h1 { font-size: 32px; margin: 0 0 8px; color: var(--accent); }
.subtitle { color: var(--text-dim); margin-bottom: 40px; font-size: 15px; }
h2 {
  font-size: 22px;
  color: var(--accent-yellow);
  margin: 40px 0 16px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--border);
}
h3 {
  font-size: 16px;
  color: var(--accent);
  margin: 0 0 16px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
}
p { color: #cbd5e1; margin: 12px 0; }

/* ==== Карточки ==== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 20px;
}
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 700px) {
  .grid-2 { grid-template-columns: 1fr; }
}
.card {
  background: var(--bg-card);
  border-radius: 12px;
  padding: 20px 24px;
  border: 1px solid var(--border);
  margin: 16px 0;
}

table { width: 100%; border-collapse: collapse; font-size: 13px; }
td { padding: 10px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: none; }
.desc { color: #cbd5e1; }

code {
  background: var(--bg);
  color: var(--accent-yellow);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: "Consolas", "Monaco", monospace;
  font-size: 12.5px;
}
.example {
  display: block;
  margin-top: 4px;
  color: var(--text-muted);
  font-family: "Consolas", "Monaco", monospace;
  font-size: 11.5px;
}
.human {
  display: block;
  margin-top: 4px;
  color: var(--accent-green);
  font-size: 12px;
  font-style: italic;
}
.symbol {
  display: inline-block;
  background: var(--bg);
  color: var(--accent-yellow);
  padding: 4px 12px;
  border-radius: 6px;
  font-family: "Consolas", "Monaco", monospace;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}
.meaning {
  color: var(--accent-green);
  font-weight: 600;
  font-size: 15px;
  margin: 8px 0;
}
pre {
  background: var(--bg);
  padding: 16px;
  border-radius: 8px;
  overflow-x: auto;
  font-family: "Consolas", "Monaco", monospace;
  font-size: 13px;
  color: var(--text);
  margin: 12px 0;
  border-left: 3px solid var(--accent);
  white-space: pre-wrap;
}

.warn {
  background: #422006;
  border-left: 3px solid var(--accent-yellow);
  padding: 12px 16px;
  border-radius: 6px;
  margin: 12px 0;
  color: #fde68a;
  font-size: 13px;
}
.note {
  margin-top: 40px;
  padding: 20px 24px;
  background: var(--bg-card);
  border-left: 3px solid var(--accent-green);
  border-radius: 8px;
  font-size: 14px;
  color: #cbd5e1;
}
.note strong { color: var(--accent-green); }

.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
  font-size: 16px;
}
.error {
  text-align: center;
  padding: 60px 20px;
  color: #fca5a5;
  font-size: 16px;
}
.error code {
  display: block;
  margin-top: 12px;
  color: var(--accent-yellow);
}

/* ==== Гамбургер ==== */
.hamburger {
  display: none;
  position: fixed;
  top: 16px;
  left: 16px;
  width: 44px;
  height: 44px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  z-index: 60;
  padding: 10px;
  flex-direction: column;
  justify-content: space-between;
  align-items: stretch;
}

.hamburger span {
  display: block;
  height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: all 0.25s;
}

.hamburger.open span:nth-child(1) {
  transform: translateY(10px) rotate(45deg);
}
.hamburger.open span:nth-child(2) {
  opacity: 0;
}
.hamburger.open span:nth-child(3) {
  transform: translateY(-10px) rotate(-45deg);
}

/* ==== Overlay ==== */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 40;
  opacity: 0;
  transition: opacity 0.25s;
}
.overlay.open {
  display: block;
  opacity: 1;
}

/* ==== Мобила ==== */
@media (max-width: 900px) {
  .hamburger {
    display: flex;
  }

  .sidebar {
    transform: translateX(-100%);
    box-shadow: 2px 0 20px rgba(0, 0, 0, 0.5);
  }
  .sidebar.open {
    transform: translateX(0);
  }

  .content {
    margin-left: 0;
    padding: 72px 16px 60px;
  }

  h1 { font-size: 24px; }
  h2 { font-size: 18px; }
  .grid {
    grid-template-columns: 1fr;
  }
  .card {
    padding: 16px 18px;
  }
  pre {
    font-size: 12px;
    padding: 12px;
  }
}
/* ==== Поиск ==== */
.search-box {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}

#search-input {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  transition: border-color 0.15s;
}

#search-input:focus {
  outline: none;
  border-color: var(--accent);
}

#search-input::placeholder {
  color: var(--text-muted);
}

.search-controls {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 6px;
  min-height: 28px;
}

.search-counter {
  flex: 1;
  font-size: 12px;
  color: var(--text-dim);
  font-family: "Consolas", "Monaco", monospace;
}

.search-counter.has-results {
  color: var(--accent);
  font-weight: 600;
}

.search-counter.no-results {
  color: #fca5a5;
}

.search-controls button {
  width: 28px;
  height: 28px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  font-family: inherit;
}

.search-controls button:hover:not(:disabled) {
  background: var(--bg);
  color: var(--accent);
  border-color: var(--accent);
}

.search-controls button:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* Подсветка найденного блока */
@keyframes highlight-pulse {
  0%   { background: rgba(251, 191, 36, 0.4); }
  100% { background: transparent; }
}

.highlight {
  animation: highlight-pulse 1.5s ease-out;
  border-radius: 8px;
}

/* Подсветка текста внутри блока */
mark.search-hit {
  background: rgba(251, 191, 36, 0.5);
  color: #fff;
  padding: 1px 2px;
  border-radius: 3px;
}

mark.search-hit.current {
  background: #fbbf24;
  color: #0f172a;
  box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.4);
}
</style>
<noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>

<!-- Кнопка гамбургер (только на мобиле) -->
<button class="hamburger" id="hamburger" aria-label="Меню">
  <span></span>
  <span></span>
  <span></span>
</button>

<!-- Затемнение под панелью (только на мобиле) -->
<div class="overlay" id="overlay"></div>

<!-- Боковая панель -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="logo">PHP</span>
    <span class="logo-sub">Уроки</span>
  </div>
<div class="search-box">
  <input 
    type="search" 
    id="search-input" 
    placeholder="Поиск (Ctrl+K)"
    autocomplete="off"
  >
  <div class="search-controls">
    <span class="search-counter" id="search-counter">0 / 0</span>
    <button id="search-prev" title="Предыдущее (Shift+Enter)">↑</button>
    <button id="search-next" title="Следующее (Enter)">↓</button>
  </div>
</div>
  <nav class="nav" id="nav"></nav>
</aside>

<!-- Контент -->
<main class="content" id="content"></main>

<script src="app.js" defer></script>
</body>
</html>
